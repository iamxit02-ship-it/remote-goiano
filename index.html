<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Remote Goiano</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .btn { background-color: #ff4757; color: white; border: none; padding: 15px 25px; font-size: 18px; margin: 10px; border-radius: 8px; cursor: pointer; width: 80%; max-width: 300px; }
        .btn:active { background-color: #ff6b81; }
    </style>
</head>
<body>

    <h2>Painel de Controle</h2>
    <p>Status: <span id="status" style="color: yellow;">Conectando...</span></p>

    <div>
        <button class="btn" onclick="enviarComando('Aimbot', 'ON')">Ativar Aimbot</button>
        <button class="btn" onclick="enviarComando('ESP', 'ON')">Ativar ESP</button>
        <button class="btn" onclick="enviarComando('Funcoes', 'OFF')">Desativar Tudo</button>
    </div>

    <script>
        // Endereço do WebSocket atualizado com o seu túnel Serveo
        const wsUrl = "wss://723e0d0a5bbd3995-38-191-127-66.serveousercontent.com";
        let ws;

        function conectar() {
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                document.getElementById("status").innerText = "Conectado!";
                document.getElementById("status").style.color = "lime";
            };

            ws.onclose = function() {
                document.getElementById("status").innerText = "Desconectado. Tentando reconectar...";
                document.getElementById("status").style.color = "red";
                setTimeout(conectar, 3000);
            };
        }

        function enviarComando(action, value) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const dados = JSON.stringify({ action: action, value: value });
                ws.send(dados);
                alert("Comando enviado: " + action);
            } else {
                alert("Erro: O painel não está conectado ao Termux!");
            }
        }

        conectar();
    </script>

</body>
</html>
